substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: class-reflect
  _API_SERVICE: class-reflect-api
  _WEB_SERVICE: class-reflect-web
  _WORKER_SERVICE: class-reflect-worker

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/docker/Dockerfile.api
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_API_SERVICE}:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_API_SERVICE}:$BUILD_ID

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/docker/Dockerfile.web
      - --build-arg
      - NEXT_PUBLIC_API_BASE_URL=https://${_API_SERVICE}-113773741484.${_REGION}.run.app
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_WEB_SERVICE}:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_WEB_SERVICE}:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_API_SERVICE}:$BUILD_ID
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --memory
      - 2Gi
      - --cpu
      - "2"
      - --timeout
      - "3600"
      - --set-env-vars
      - NODE_ENV=production,ASR_PROVIDER=aliyun,CLOUD_TASKS_PROJECT_ID=$PROJECT_ID,CLOUD_TASKS_LOCATION=${_REGION},CLOUD_TASKS_QUEUE=lesson-workflows,WORKER_BASE_URL=https://${_WORKER_SERVICE}-113773741484.${_REGION}.run.app,WORKFLOW_TASK_PATH=/api/workflows/process
      - --set-secrets
      - APP_CONFIG_ENV=APP_CONFIG_ENV:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WEB_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_WEB_SERVICE}:$BUILD_ID
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --memory
      - 1Gi
      - --cpu
      - "1"
      - --timeout
      - "300"
      - --set-env-vars
      - NODE_ENV=production,NEXT_PUBLIC_API_BASE_URL=https://${_API_SERVICE}-113773741484.${_REGION}.run.app

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WORKER_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_API_SERVICE}:$BUILD_ID
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --memory
      - 2Gi
      - --cpu
      - "2"
      - --timeout
      - "3600"
      - --command
      - pnpm
      - --args
      - --filter,@class-reflect/worker,start
      - --set-env-vars
      - NODE_ENV=production,ASR_PROVIDER=aliyun
      - --set-secrets
      - APP_CONFIG_ENV=APP_CONFIG_ENV:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_API_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_WEB_SERVICE}:$BUILD_ID
