<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI课堂回放与教学分析</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-topbar">
        <div class="brand-area">
          <div class="brand-mark">AI</div>
          <div>
            <h1>AI课堂回放与教学分析</h1>
            <p>五年级数学《分数的意义和分数单位》</p>
          </div>
        </div>
        <div class="top-actions">
          <button class="light-button" type="button" id="showLibrary">视频库</button>
          <button class="light-button" type="button" id="newAnalysis">新建分析</button>
          <div class="teacher-avatar">张</div>
          <span>张老师</span>
        </div>
      </header>

      <main class="library-view" id="libraryView">
        <section class="library-hero">
          <div>
            <p class="section-kicker">课堂视频库</p>
            <h2>已有课堂视频</h2>
            <span>查看已上传的视频、处理状态和转写结果；也可以删除不需要的课堂记录。</span>
          </div>
          <button class="primary-button" type="button" id="startAnalysis">上传新视频</button>
        </section>
        <section class="library-list" id="lessonList" aria-label="已有课堂视频"></section>
      </main>

      <main class="main-layout" id="workspaceView">
        <section class="evidence-workspace" aria-label="课堂证据工作区">
          <div class="video-header">
            <div>
              <p class="section-kicker">课堂视频（语音转文字分析）</p>
              <h2 id="lessonTitle">上传课堂视频后开始复盘</h2>
            </div>
            <label class="upload-button">
              <input id="videoInput" type="file" accept="video/*" />
              <span id="videoName">上传课堂视频</span>
            </label>
          </div>

          <div class="video-stage" id="videoStage">
            <div class="upload-empty" id="uploadEmpty">
              <div class="upload-icon">↑</div>
              <strong>拖入或选择课堂视频</strong>
              <span>第一版只基于音频转写与课堂原文分析，不做视频 OCR 或画面框选。</span>
            </div>
            <video id="classVideo" controls playsinline></video>
            <div class="time-evidence-chip" id="evidenceChip">语音证据 11:20 - 11:28</div>
          </div>

          <div class="segment-rail" aria-label="课堂片段时间轴">
            <button class="rail-arrow" type="button" id="prevSegment">‹</button>
            <div class="segment-tabs" id="segmentTabs"></div>
            <button class="rail-arrow" type="button" id="nextSegment">›</button>
          </div>

          <section class="record-card" aria-labelledby="recordTitle">
            <div class="record-header">
              <div>
                <p class="section-kicker">课堂记录</p>
                <h2 id="recordTitle">大段编辑，无需逐句确认</h2>
              </div>
              <div class="record-tabs" role="tablist" aria-label="记录视图">
                <button class="record-tab active" type="button" data-view="zh">中文记录</button>
                <button class="record-tab" type="button" data-view="en">英文原文</button>
                <button class="record-tab" type="button" data-view="both">中英对照</button>
              </div>
            </div>
            <textarea id="recordEditor" spellcheck="false"></textarea>
            <div class="record-footer">
              <span id="saveStatus">已自动保存</span>
              <div class="record-actions">
                <button class="light-button" type="button" id="editRecord">编辑记录</button>
                <button class="primary-button" type="button" id="saveRecord">保存记录</button>
                <button class="light-button" type="button" id="markImportant">标记重点</button>
                <button class="light-button" type="button" id="markConfusing">标记困惑</button>
                <button class="light-button" type="button" id="reanalyzeSegment">重新分析此段</button>
              </div>
            </div>
          </section>
        </section>

        <aside class="assistant-panel" aria-label="AI任务助手">
          <div class="progress-card">
            <h2>AI任务助手</h2>
            <ol class="flow-steps" id="flowSteps"></ol>
          </div>

          <div class="conversation" id="conversation"></div>

          <form class="assistant-input" id="taskForm">
            <input
              id="taskInput"
              type="text"
              placeholder="继续提问或调整分析条件..."
              autocomplete="off"
            />
            <button type="submit" aria-label="发送">➜</button>
          </form>
        </aside>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
