substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: class-reflect
  _SERVICE: class-reflect-api

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --memory
      - 2Gi
      - --cpu
      - "2"
      - --timeout
      - 3600
      - --set-env-vars
      - NODE_ENV=production,ASR_PROVIDER=aliyun,ALIYUN_ASR_MODEL=qwen3-asr-flash-filetrans,ALIYUN_ASR_BASE_URL=https://dashscope.aliyuncs.com/api/v1,ALIYUN_ASR_POLL_INTERVAL_MS=3000,ALIYUN_ASR_TIMEOUT_MS=600000,ALIYUN_ASR_FILE_URL_EXPIRES_SECONDS=3600
      - --set-secrets
      - DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,R2_ACCOUNT_ID=R2_ACCOUNT_ID:latest,R2_ENDPOINT=R2_ENDPOINT:latest,R2_BUCKET=R2_BUCKET:latest,R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest,R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:latest,ALIYUN_DASHSCOPE_API_KEY=ALIYUN_DASHSCOPE_API_KEY:latest,LLM_BASE_URL=LLM_BASE_URL:latest,LLM_API_KEY=LLM_API_KEY:latest,LLM_MODEL=LLM_MODEL:latest,FRONTEND_ORIGIN=FRONTEND_ORIGIN:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA
